<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="212" viewBox="0 0 1120 212" role="img" aria-labelledby="title desc">
  <title id="title">WorkBuddy QQ Agent Gateway</title>
  <desc id="desc">Two chat bubbles connected by a blue signal.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1120" y2="212" gradientUnits="userSpaceOnUse">
      <stop stop-color="#101c30"/>
      <stop offset="1" stop-color="#111523"/>
    </linearGradient>
    <linearGradient id="route" x1="767" y1="0" x2="1020" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#719dff"/>
      <stop offset="1" stop-color="#75e7d4"/>
    </linearGradient>
    <radialGradient id="glow" cx=".5" cy=".5" r=".5">
      <stop stop-color="#3a67c5" stop-opacity=".38"/>
      <stop offset="1" stop-color="#3a67c5" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <style>
    .signal{stroke-dasharray:24 229;animation:travel 3.2s linear infinite}
    .node{animation:pulse 3.2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
    @keyframes travel{to{stroke-dashoffset:-253}}
    @keyframes pulse{0%,100%{opacity:.65;transform:scale(.84)}50%{opacity:1;transform:scale(1.1)}}
    @media(prefers-reduced-motion:reduce){.signal,.node{animation:none}}
  </style>
  <rect x="1" y="1" width="1118" height="210" rx="25" fill="url(#background)" stroke="#3a4a67" stroke-width="2"/>
  <ellipse cx="906" cy="106" rx="196" ry="100" fill="url(#glow)"/>
  <g font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif">
    <text x="49" y="81" font-size="21" font-weight="600" letter-spacing="2.5" fill="#a7bbdd">WorkBuddy</text>
    <text x="46" y="142" font-size="52" font-weight="700" letter-spacing="-1.6" fill="#f4f7ff">QQ Agent Gateway</text>
  </g>
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M604 106h480M605 71h75l35 35M954 106l35 35h95" stroke="#6585bd" opacity=".27"/>
    <path d="M766 106h254" stroke="#5b78b4" stroke-width="2"/>
    <path class="signal" d="M766 106h254" stroke="url(#route)" stroke-width="3"/>
    <path fill="#1b3053" stroke="#8bb7ff" stroke-width="2" d="M675 74h72a15 15 0 0 1 15 15v31a15 15 0 0 1-15 15h-40l-21 15v-15h-11a15 15 0 0 1-15-15V89a15 15 0 0 1 15-15z"/>
    <path fill="#19343e" stroke="#7de3d6" stroke-width="2" d="M956 71h76a15 15 0 0 1 15 15v31a15 15 0 0 1-15 15h-11v16l-22-16h-43a15 15 0 0 1-15-15V86a15 15 0 0 1 15-15z"/>
    <path d="M965 94h58m-58 13h39" stroke="#9aeee2" stroke-width="2.5"/>
  </g>
  <g fill="#a6c9ff"><circle cx="690" cy="105" r="4"/><circle cx="711" cy="105" r="4"/><circle cx="732" cy="105" r="4"/></g>
  <circle class="node" cx="851" cy="106" r="8" fill="#9bcaff" stroke="#293d62" stroke-width="2"/>
</svg>
