name: 验证公开版
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: npm test
      - run: pip install -r modules/workbuddy-agent/requirements.txt
      - run: python test/workbuddy-bridge-recovery.test.py
      - run: python test/workbuddy-image-preview.test.py
      - run: npm run audit:public
